<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saniya's Party Mode!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Syncopate:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00f2ff;
            --neon-yellow: #f3ff00;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body, html {
            background-color: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0a2e 0%, #000 100%);
            -webkit-tap-highlight-color: transparent;
        }

        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        .main-wrapper {
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .step-container { 
            display: none; 
            width: 95%; 
            max-width: 500px; 
            text-align: center; 
            padding: 20px; 
        }
        .active { display: block !important; }

        .saniya-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 12vw, 5rem);
            letter-spacing: 8px;
            background: linear-gradient(to right, var(--neon-blue), #fff, var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5));
            margin-bottom: 2rem;
        }

        .party-card {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            padding: clamp(20px, 5vw, 40px);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .btn-proceed {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: white;
            font-family: 'Syncopate', sans-serif;
            padding: 14px 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            transition: 0.3s all ease;
            cursor: pointer;
            border-radius: 50px;
            width: 80%;
            margin-top: 10px;
        }

        .btn-proceed:active {
            transform: scale(0.95);
            background: var(--neon-pink);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        /* Responsive Scratch Wrapper */
        .scratch-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--neon-yellow);
        }

        .number-bg {
            background: #111;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-weight: 800; color: var(--neon-yellow);
            font-family: 'Orbitron', sans-serif;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .scratch-box {
            position: relative; 
            width: 100%; 
            aspect-ratio: 1/1;
            border-radius: 12px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .scratch-box img { width: 100%; height: 100%; object-fit: cover; }

        .scratch-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            touch-action: none;
            z-index: 5;
        }

        .polaroid {
            width: 240px; 
            background: white; 
            padding: 10px 10px 30px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transform: rotate(var(--r));
            margin-bottom: 20px;
        }
        .polaroid img { width: 100%; height: 180px; object-fit: cover; }
        .polaroid p { color: #333; font-family: 'Syncopate'; font-size: 8px; margin-top: 10px; text-align: center;}
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="main-wrapper">
        <div id="step1" class="step-container active">
            <h1 class="saniya-title animate__animated animate__fadeInDown">SANIYA<br><span style="font-size: 0.4em; letter-spacing: 15px; opacity: 0.8;">THE ITIIAN</span></h1>
            <button class="btn-proceed" onclick="goToStep(2)">Initialize</button>
        </div>

        <div id="step2" class="step-container">
            <div class="party-card animate__animated animate__zoomIn">
                <h2 style="font-family: 'Syncopate'; font-size: 1.2rem; color: var(--neon-blue);">Incoming Message</h2>
                <p class="opacity-75 my-4">Decryption required to view special 21st birthday data.</p>
                <button class="btn-proceed" onclick="goToStep(3)">Decrypt Now</button>
            </div>
        </div>

        <div id="step3" class="step-container">
            <div class="party-card">
                <p class="text-uppercase small fw-bold mb-3" style="color: var(--neon-yellow); letter-spacing: 2px;">Swipe to reveal</p>
                <div class="scratch-wrap">
                    <div class="number-bg">HAPPY 21st<br>SANIYA</div>
                    <canvas id="scratch-canvas-main" class="scratch-canvas"></canvas>
                </div>
                <div id="reveal-btn-container">
                    <button id="enter-btn" class="btn-proceed" style="display: none;" onclick="goToStep(4)">View Wishes</button>
                </div>
            </div>
        </div>

        <div id="step4" class="step-container">
            <div class="party-card">
                <div id="wish-text" class="h4" style="min-height: 100px; display: flex; align-items: center; justify-content: center;"></div>
                <div id="wish-btn-space"></div>
            </div>
        </div>

        <div id="step5" class="step-container">
            <div class="party-card">
                <h3 class="mb-3" style="font-family: 'Syncopate'; font-size: 1rem;">Memory Bank</h3>
                <div class="photo-grid" id="photo-grid-container"></div>
                <div id="reveal-btn-container">
                    <button id="collage-btn" class="btn-proceed" style="display:none;" onclick="goToStep(6)">Final Surprise</button>
                </div>
            </div>
        </div>

        <div id="step6" class="step-container p-0" style="width:100vw; height:100vh; position:fixed; top:0; left:0; background: black;">
            <div id="collage-wrapper" style="display: flex; flex-direction: column; align-items: center; padding-top: 50px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        const myPhotos = ["pic1.jpeg", "pic2.jpeg", "pic3.jpeg", "pic4.jpeg", "pic5.jpeg", "pic7.jpeg", "pic8.jpeg", "pic9.jpeg", "pic10.jpeg"];
        const wishes = ["HAPPY BIRTHDAY SANIYA!", "TO THE BRIGHTEST ITIIAN...", "MAY YOUR CODE ALWAYS COMPILE!", "STAY NEON.", "HERE'S TO 21!"];

        function goToStep(num) {
            document.querySelectorAll('.step-container').forEach(s => s.classList.remove('active'));
            const nextStep = document.getElementById('step' + num);
            nextStep.classList.add('active');
            
            if(num === 3) initScratch('scratch-canvas-main', () => {
                document.getElementById('enter-btn').style.display = 'inline-block';
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            });
            if(num === 4) startWishes();
            if(num === 5) initPhotoGrid();
            if(num === 6) startVerticalScroll();
        }

        function initScratch(canvasId, callback) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            const resize = () => {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#666';
                ctx.font = '12px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText('SCRATCH AREA', canvas.width/2, canvas.height/2);
            };

            resize();

            let isDrawing = false;

            const scratch = (x, y) => {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 25, 0, Math.PI * 2);
                ctx.fill();

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let transparent = 0;
                for (let i = 3; i < imageData.length; i += 80) { // Optimized sampling
                    if (imageData[i] === 0) transparent++;
                }
                
                if (transparent > (imageData.length / 80) * 0.5) {
                    canvas.style.pointerEvents = 'none';
                    gsap.to(canvas, { opacity: 0, duration: 0.5, onComplete: callback });
                }
            };

            const handleInput = (e) => {
                if (!isDrawing) return;
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                scratch(x, y);
            };

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); }, {passive: false});
            window.addEventListener('mouseup', () => isDrawing = false);
            window.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('mousemove', handleInput);
            canvas.addEventListener('touchmove', handleInput, {passive: false});
        }

        async function startWishes() {
            const display = document.getElementById('wish-text');
            for(let wish of wishes) {
                display.innerHTML = `<span class="animate__animated animate__fadeInUp">${wish}</span>`;
                await new Promise(r => setTimeout(r, 2000));
                display.innerHTML = ``;
                await new Promise(r => setTimeout(r, 200));
            }
            document.getElementById('wish-btn-space').innerHTML = `<button class="btn-proceed animate__animated animate__fadeIn" onclick="goToStep(5)">Unlock Memories</button>`;
        }

        let solvedGrid = 0;
        function initPhotoGrid() {
            const container = document.getElementById('photo-grid-container');
            container.innerHTML = "";
            for(let i=0; i<6; i++) {
                const box = document.createElement('div');
                box.className = "scratch-box";
                const cid = `grid-canvas-${i}`;
                box.innerHTML = `<img src="${myPhotos[i]}"><canvas id="${cid}" class="scratch-canvas"></canvas>`;
                container.appendChild(box);
                setTimeout(() => initScratch(cid, () => {
                    solvedGrid++;
                    if(solvedGrid >= 6) document.getElementById('collage-btn').style.display = 'inline-block';
                }), 100);
            }
        }

        function startVerticalScroll() {
            const track = document.getElementById('collage-wrapper');
            const fullList = [...myPhotos, ...myPhotos];
            fullList.forEach((src) => {
                const p = document.createElement('div');
                p.className = "polaroid";
                p.style.setProperty('--r', (Math.random() * 6 - 3) + 'deg');
                p.innerHTML = `<img src="${src}"><p>SANIYA @ 21</p>`;
                track.appendChild(p);
            });
            gsap.to(track, { y: - (track.scrollHeight / 2), duration: 20, ease: "none", repeat: -1 });
            
            // Random confetti bursts
            setInterval(() => {
                confetti({ particleCount: 50, startVelocity: 30, spread: 360, origin: { x: Math.random(), y: Math.random() - 0.2 } });
            }, 3000);
        }

        // Optimized BG Particles
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];
        function initBg() {
            bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
            particles = Array.from({length: 40}, () => ({
                x: Math.random() * bgCanvas.width, y: Math.random() * bgCanvas.height,
                s: Math.random() * 2, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3
            }));
        }
        function drawBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = "rgba(0, 242, 255, 0.3)";
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>bgCanvas.width) p.vx*=-1;
                if(p.y<0 || p.y>bgCanvas.height) p.vy*=-1;
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); bgCtx.fill();
            });
            requestAnimationFrame(drawBg);
        }
        initBg(); drawBg();
        window.addEventListener('resize', initBg);
    </script>
</body>
</html>
