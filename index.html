<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITIian Party Mode!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00f2ff;
            --neon-yellow: #f3ff00;
        }

        body {
            background-color: #050505;
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0a2e 0%, #000 100%);
        }

        /* Party Background Effect */
        .party-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--neon-pink) 1px, transparent 1px), 
                              radial-gradient(var(--neon-blue) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            opacity: 0.1;
            z-index: 1;
        }

        .step-container { display: none; width: 100%; text-align: center; z-index: 10; position: relative; }
        .active { display: block !important; }

        /* Neon UI Elements */
        .party-card {
            background: rgba(0, 0, 0, 0.7);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        .party-title {
            font-family: 'Bungee', cursive;
            font-size: 3.5rem;
            text-shadow: 3px 3px 0px var(--neon-pink), 6px 6px 0px var(--neon-blue);
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .btn-party {
            background: var(--neon-pink);
            border: none;
            color: white;
            font-family: 'Bungee', cursive;
            padding: 20px 50px;
            font-size: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 0 15px var(--neon-pink);
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-party:hover {
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 0 30px var(--neon-pink);
            background: white;
            color: var(--neon-pink);
        }

        /* Scratch Card Party Style */
        #scratch-canvas {
            border: 4px solid var(--neon-yellow);
            box-shadow: 0 0 15px var(--neon-yellow);
            border-radius: 15px;
        }

        .number-bg {
            background: black;
            width: 250px; height: 150px;
            margin: 0 auto;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 90px; font-weight: 800; color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        /* Moveable Photos - Polaroids */
        .polaroid {
            width: 160px;
            background: white;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: absolute;
            cursor: move;
            touch-action: none;
            z-index: 100;
        }

        .polaroid img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="party-bg"></div>

    <div id="step1" class="step-container active">
        <h1 class="party-title mb-5 animate__animated animate__bounceInDown">YO ITIIAN!</h1>
        <button class="btn-party animate__animated animate__pulse animate__infinite" onclick="goToStep(2)">
            CLICK TO START ⚡
        </button>
    </div>

    <div id="step2" class="step-container px-4">
        <div class="party-card animate__animated animate__jackInTheBox">
            <h2 class="party-title" style="font-size: 2.5rem;">GUESS WHAT?</h2>
            <p class="h4 mt-4" style="color: var(--neon-blue);">THE PARTY JUST STARTED!</p>
            <p class="mb-4">It's your special day, and we're going wild.</p>
            <button class="btn btn-outline-info rounded-0 w-100 fw-bold" onclick="goToStep(3)">REVEAL THE SECRET</button>
        </div>
    </div>

    <div id="step3" class="step-container px-4">
        <div class="party-card animate__animated animate__flipInY">
            <p class="text-uppercase fw-bold mb-3" style="color: var(--neon-yellow); letter-spacing: 3px;">Scratch to reveal</p>
            <div class="position-relative" style="width: 250px; height: 150px; margin: 0 auto;">
                <div class="number-bg">21</div>
                <canvas id="scratch-canvas" width="250" height="150" style="position:absolute; top:0; left:0;"></canvas>
            </div>
            <h2 class="mt-4 animate__animated animate__flash animate__infinite animate__slow" style="color: var(--neon-pink);">HAPPY BIRTHDAY!</h2>
            <button class="btn-party mt-4 w-100" style="font-size: 1.1rem;" onclick="goToStep(4)">ENTER YOUR 21</button>
        </div>
    </div>

    <div id="step4" class="step-container">
        <h2 class="party-title animate__animated animate__rubberBand" style="font-size: 2.5rem;">VIBE CHECK! ✨</h2>
        <p class="fw-bold" style="color: var(--neon-blue);">Throw your memories around!</p>
        
        <div class="polaroid" style="top:20%; left:10%; transform: rotate(-5deg);">
            <img src="https://picsum.photos/200?random=11">
        </div>
        <div class="polaroid" style="top:45%; left:35%; transform: rotate(8deg);">
            <img src="https://picsum.photos/200?random=12">
        </div>
        <div class="polaroid" style="top:15%; left:65%; transform: rotate(-10deg);">
            <img src="https://picsum.photos/200?random=13">
        </div>
        <div class="polaroid" style="top:60%; left:60%; transform: rotate(5deg);">
            <img src="https://picsum.photos/200?random=14">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

    <script>
        function goToStep(num) {
            document.querySelectorAll('.step-container').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + num).classList.add('active');

            if(num === 3) initScratch();
            if(num === 4) {
                // Party Confetti explosion
                var end = Date.now() + (5 * 1000);
                var colors = ['#ff00ff', '#00f2ff', '#f3ff00'];

                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
                initDraggable();
            }
        }

        function initScratch() {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#444'; // Dark grey scratch area
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#666';
            ctx.font = '20px Bungee';
            ctx.textAlign = 'center';
            ctx.fillText('SCRATCH IT!', 125, 85);

            function scratch(e) {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.fill();
            }

            canvas.addEventListener('mousemove', (e) => { if(e.buttons === 1) scratch(e); });
            canvas.addEventListener('touchmove', (e) => { scratch(e); e.preventDefault(); });
        }

        function initDraggable() {
            interact('.polaroid').draggable({
                inertia: true,
                listeners: {
                    move (event) {
                        var target = event.target;
                        var x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
                        var y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
                        target.style.transform = `translate(${x}px, ${y}px) rotate(${x/20}deg)`;
                        target.setAttribute('data-x', x);
                        target.setAttribute('data-y', y);
                    }
                }
            });
        }
    </script>
</body>
</html>
